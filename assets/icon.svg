<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#5E5CE6" />
      <stop offset="100%" stop-color="#BF5AF2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Apple Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#appleGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25" />

  <!-- Outlined Lightning Bolt from App.tsx -->
  <path
    d="M13 10V3L4 14h7v7l9-11h-7z"
    transform="translate(74, 74) scale(15.16)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
